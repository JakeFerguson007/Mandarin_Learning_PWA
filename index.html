<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandarin Learning</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <div id="homeScreen">
            <h1>Mandarin Learning</h1>
            <h2>Choose a Lesson</h2>
            <div id="lessonList"></div>
            <h2>Word Building</h2>
            <div id="wordLessonList"></div>
        </div>

        <div id="lessonScreen" class="hidden">
            <button id="backButton" class="backButton">← Lessons</button>
            <h1>Mandarin Learning</h1>
            <h2 id="lessonTitle"></h2>
            <div class="progress">Character <span id="cardNumber">1</span> of <span id="cardTotal">5</span></div>
            <div class="flashcard">
                <div id="character" class="character hidden"></div>
                <div id="pinyin" class="pinyin hidden"></div>
                <div id="meaning" class="meaning hidden"></div>
            </div>
            <button id="revealButton">Reveal</button>
            <button id="nextButton" class="hidden">Next</button>
        </div>

        <div id="wordLessonScreen" class="hidden">
            <button id="wordBackButton" class="backButton">← Lessons</button>
            <h1>Word Building</h1>
            <h2 id="wordLessonTitle"></h2>
            <div class="progress">Word <span id="wordCardNumber">1</span> of <span id="wordCardTotal">5</span></div>
            <div class="flashcard">
                <div id="word" class="character hidden"></div>
                <div id="wordPinyin" class="pinyin hidden"></div>
                <div id="wordMeaning" class="meaning hidden"></div>
            </div>
            <button id="wordRevealButton">Reveal</button>
            <button id="wordNextButton" class="hidden">Next</button>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
